##################################################################################################################################
# log4j.properties from runner/

#log4j.appender.stdout=org.apache.log4j.ConsoleAppender
#log4j.appender.stdout.Target=System.out
#log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
#log4j.appender.stdout.layout.ConversionPattern=%m%n
#log4j.rootLogger=info, stdout

log4j.rootLogger=ERROR, R
log4j.appender.R=org.apache.log4j.RollingFileAppender
log4j.appender.R.File=${catalina.base}/logs/JABAWSErrorFile.log
# Ceiling: 10MB * (1 + 5) = 60MB. Rolls to JABAWSErrorFile.log.1 .. .5,
# oldest discarded. log4j renames and reopens the file itself, so nothing
# external needs to signal the JVM.
log4j.appender.R.MaxFileSize=10MB
log4j.appender.R.MaxBackupIndex=5
log4j.appender.R.layout=org.apache.log4j.PatternLayout
log4j.appender.R.layout.ConversionPattern=%m%n %d{MM-dd@HH:mm:ss} %-5p (%13F:%L) %3x - 

# %d{ABSOLUTE} %5p %c{1}:%L -
log4j.logger.compbio=WARN, B
# Without this the same messages also reach the root logger's R appender, and
# engine.log / JABAWSErrorFile.log end up identical byte for byte.
log4j.additivity.compbio=false
log4j.appender.B=org.apache.log4j.RollingFileAppender
log4j.appender.B.File=${catalina.base}/logs/engine.log
# Ceiling: 10MB * (1 + 5) = 60MB, as for R above. engine.log carries the bulk
# of the volume -- it is where a failed alignment job explains itself -- so
# raise MaxBackupIndex here if you need a longer history.
log4j.appender.B.MaxFileSize=10MB
log4j.appender.B.MaxBackupIndex=5
log4j.appender.B.layout=org.apache.log4j.PatternLayout
log4j.appender.B.layout.ConversionPattern=%m%n %d{MM-dd@HH:mm:ss} %-5p (%13F:%L) %3x - 

