################################################################################
# Vendored copy of WEB-INF/classes/log4j.properties from the stock JABAWS 2.2
# WAR, patched for a long-lived container. The Dockerfile copies this over the
# original in the war-patcher stage, the same way it does Executable.properties.
#
# Three deliberate changes from upstream, all near the bottom of the file:
#
#   1. Appenders R and B are RollingFileAppender, not FileAppender. Upstream
#      writes engine.log and JABAWSErrorFile.log as single files that are only
#      ever appended to, so on a server they grow until the logs volume fills.
#      RollingFileAppender caps each at MaxFileSize * (MaxBackupIndex + 1).
#
#      Size-based, not DailyRollingFileAppender: the log4j 1.2 daily appender
#      has no retention setting at all and never deletes what it rolls, which
#      trades one unbounded file for unbounded numbered ones.
#
#   2. log4j.additivity.compbio=false. Upstream leaves additivity on, so every
#      message the compbio logger emits is written to B *and* propagates to the
#      root logger's R -- engine.log and JABAWSErrorFile.log came out
#      byte-identical. Turning it off halves the write volume and leaves
#      JABAWSErrorFile.log holding what its name implies: errors from
#      everything that is not the engine.
#
#   3. Nothing else. The large commented-out blocks are upstream's and are kept
#      verbatim so this file still diffs cleanly against a future WAR.
#
# Appender config is read once when the webapp starts, so editing this file
# means rebuilding the image (or bind-mounting it over
# /usr/local/tomcat/webapps/jabaws/WEB-INF/classes/log4j.properties and
# restarting the container).
################################################################################

## CHANGE THIS (The root directory where to store all the log files)
#logDir = .

## Uncomment to enable JWS2 activity logging to standard out (to the console if available)
## for possible log levels please refer to Log4j documentation http://logging.apache.org/log4j/1.2/manual.html 
## Valid log levels are:
## TRACE - log everything from below including very detailed messages (useful for debugging only)
## DEBUG - log everything from below including some minor events (useful for debugging only)
## INFO - log everything from below including some information messages
## WARN - log error and warnings
## ERROR - log errors and fatal events only 
## FATAL - log fatal events only

# To see debug messages in TldLocationsCache, uncomment the following line:
#org.apache.jasper.compiler.TldLocationsCache.level = FINE
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].level = FINE

